schema_version: 1
kind: skill
name: update-tool
description: 更新、升级或审核 `tools/<tool_id>/` 已有工具：按 `source/current_version` 查上游并同步 toolskill 与治理信息。
trigger:
  keywords:
    - 更新工具
    - 升级工具
    - tool update
    - update-tool
    - 同步上游
    - 查询最新版本
    - 更新 toolskill
    - 升级 vendored 工具
    - 更新外置工具
    - install_dir
  always: false
requires:
  tools:
    - filesystem_write
    - filesystem_edit
  bins: []
  env: []
content:
  main: SKILL.md
exposure:
  agent: true
  main_runtime: true
