schema_version: 1
kind: skill
name: skill-creator
description: 创建、更新、迁移或校验 Negi 的 `skills/` 与 `tools/` 资源；现成 skill 的 GitHub 安装转 `skill-installer`。
trigger:
  keywords:
    - skill-creator
    - agent-skill-creator
    - 创建技能
    - 创建 skill
    - 新建 skill
    - 接入 tool
    - 接入工具
    - 创建工具
    - 新增工具
    - 封装 CLI
    - 自动化流程
    - automate workflow
    - validate skill
    - export skill
    - migrate skill
    - 多 agent
    - skill factory
  always: false
requires:
  tools:
    - filesystem_write
    - filesystem_edit
    - exec
  bins: []
  env: []
content:
  main: SKILL.md
  references: references
  scripts: scripts
exposure:
  agent: true
  main_runtime: true
