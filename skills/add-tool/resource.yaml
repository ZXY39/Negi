schema_version: 1
kind: skill
name: add-tool
description: 新增、迁移、合并或审核 `tools/<tool_id>/` 工具资源；覆盖 `resource.yaml`、toolskill、异步约束与 MCP 接入。
trigger:
  keywords:
    - 添加工具
    - 新增工具
    - 创建工具
    - MCP 工具
    - toolskill
    - 开源工具接入
    - 接入工具
    - 包装 CLI
    - 外置工具
    - 内置工具
    - install_dir
  always: false
requires:
  tools:
    - filesystem_write
    - filesystem_edit
  bins: []
  env: []
content:
  main: SKILL.md
exposure:
  agent: true
  main_runtime: true
