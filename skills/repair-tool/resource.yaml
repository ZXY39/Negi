schema_version: 1
kind: skill
name: repair-tool
description: 修复已注册但不可用、缺依赖/本地安装或不在 callable 列表的工具资源；修复后用 `load_tool_context` 复核。
trigger:
  keywords:
    - repair-tool
    - 修复工具
    - 工具不可用
    - 工具缺失
    - tool repair
    - missing required paths
    - missing required bins
    - missing required env
    - load_tool_context
    - callable tool list
    - externaltools
    - 第三方本体
  always: false
requires:
  tools:
    - filesystem_write
    - filesystem_edit
    - exec
    - load_tool_context
  bins: []
  env: []
content:
  main: SKILL.md
exposure:
  agent: true
  main_runtime: true
