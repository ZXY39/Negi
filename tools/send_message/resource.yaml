schema_version: 1
kind: tool
display_name: "发送节点消息"
name: send_message
description: Send a message to task nodes in this session's tasks, or to peer sessions by short id; one-to-many via a list. Messaging an unlinked session id links it automatically.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Frontdoor-lane messaging; same to/content/ref shape as the node-side tool, task-root or node targets.
  compare_rule: Treat manifest, main/, parameter contract, or returned payload changes as version-relevant.
  source_of_truth: resource.yaml and main/tool.py define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    to:
      type: [string, array]
      items:
        type: string
      description: Task id (delivers to that task's root node), execution node id, peer session short id (like 3f9a1b2c) or session:<short id|key>, or a list of them. `task:` / `node:` / `session:` prefixes and stray spaces are accepted. A session id that is not linked yet is linked on delivery.
      minLength: 1
    content:
      type: string
      minLength: 1
      description: Message body.
    ref:
      type: string
      description: Optional pointer to a large artifact; keep content a summary then.
    reply_to:
      type: string
      description: Optional message_id of an incoming peer-session message you are answering; continues its chain. Session targets only.
  required: [to, content]
governance:
  display_name: Send Message
  description: Send a frontdoor message to execution nodes.
  risk_level: low
  destructive: false
  allowed_roles:
    - ceo
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true
