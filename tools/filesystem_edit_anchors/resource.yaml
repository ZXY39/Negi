schema_version: 1
kind: tool
name: filesystem_edit_anchors
display_name: Filesystem Edit Anchors
description: Replace the region between two anchors in one file. Use when the exact old text is too large or too fragile to quote, but stable surrounding anchors exist.
tool_result_delivery_contract: runtime_managed
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem:
    - workspace
settings:
  restrict_to_workspace: false
  edit_validation_enabled: true
  edit_validation_timeout_seconds: 20
  edit_validation_rollback_on_failure: true
  edit_validation_default_commands: []
  edit_validation_commands_by_ext:
    .py:
      - python -m py_compile {path}
parameters:
  type: object
  properties:
    path:
      type: string
      description: Absolute file path to edit.
    start_anchor:
      type: string
      description: Exact text opening the region to replace. Matches once.
    end_anchor:
      type: string
      description: Exact text closing the region to replace. Matches once, after start_anchor.
    new_text:
      type: string
      description: Replacement text for the anchored region.
  required:
    - path
    - start_anchor
    - end_anchor
    - new_text
model_parameters:
  type: object
  properties:
    path:
      type: string
      description: Absolute file path to edit.
    start_anchor:
      type: string
      description: Exact text opening the region to replace. Matches once.
    end_anchor:
      type: string
      description: Exact text closing the region to replace. Matches once, after start_anchor.
    new_text:
      type: string
      description: Replacement text for the anchored region.
  required:
    - path
    - start_anchor
    - end_anchor
    - new_text
governance:
  family: filesystem
  display_name: Filesystem
  description: Write, edit, copy, move, delete, and propose patches for local files.
  actions:
    - id: edit
      label: Edit File
      risk_level: high
      destructive: true
      allowed_roles:
        - ceo
        - execution
exposure:
  agent: true
  main_runtime: true
toolskill:
  enabled: true
