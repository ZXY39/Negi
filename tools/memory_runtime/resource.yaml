schema_version: 1
kind: tool
name: memory_runtime
description: Internal memory runtime settings anchor.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local memory runtime tool. The manifest, handler, and returned
    payload contract together define the current behavior.
  compare_rule: Treat manifest, main/, parameter contract, permissions, settings,
    and returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective
    behavior.
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
settings:
  enabled: true
  arch_version: v2
  document:
    summary_max_chars: 250
    document_max_chars: 20000
    compress_trigger_chars: 16000
    compress_target_chars: 13000
    memory_file: memory/MEMORY.md
    notes_dir: memory/notes
  queue:
    queue_file: memory/queue.jsonl
    ops_file: memory/ops.jsonl
    batch_max_chars: 50000
    max_wait_seconds: 3
    review_interval_turns: 5
  agent:
    model_key: ""
    repair_attempt_limit: 1
  features:
    unified_context: true
    layered_loading: true
    query_planner: true
    commit_pipeline: true
    observability: true
  checkpointer:
    backend: sqlite
    path: memory/checkpoints.sqlite3
    max_checkpoints_per_thread: 200
    trim_interval_seconds: 300
    vacuum_min_file_size_bytes: 536870912
    vacuum_interval_seconds: 21600
  isolation:
    mode: global
    namespace_template:
    - memory
    - global
  guard:
    mode: tiered
    auto_fact_confidence: 0.8
  commit:
    turn_trigger: 20
    idle_minutes_trigger: 360
  cost:
    max_increase_pct: 15
  assembly:
    recent_messages_limit: 24
    archive_summary_top_k: 2
    archive_summary_max_tokens: 320
    skill_inventory_top_k: 16
    skill_inventory_max_tokens: 480
    extension_tool_top_k: 16
    core_tools:
    - content
    - create_async_task
    - task_summary
    - task_list
    - task_progress
    - memory_write
    - memory_delete
    - memory_note
    - task_runtime
    - skill_access
  retention_days: null
parameters:
  type: object
  properties: {}
exposure:
  agent: false
  main_runtime: false
toolskill:
  enabled: false
