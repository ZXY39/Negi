schema_version: 1
kind: tool
display_name: "处理暂停节点"
name: manage_task_nodes
description: Manage task nodes after an error pause or operator review - resume, keep_paused, fail, or pause single nodes, whole subtrees (cascade), or mixed per-node targets in one atomic call.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local task runtime tool for reviewing and controlling paused nodes, with subtree cascade, per-target actions, and atomic overlap rejection.
  compare_rule: Treat manifest, main/, parameter contract, or toolskills changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    task_id:
      type: string
      description: Target task id.
    node_ids:
      type: array
      minItems: 1
      items:
        type: string
      description: Single-action batch form - one or more node ids that all receive the same action. Combine with action; mutually exclusive with targets.
    action:
      type: string
      enum: [resume, keep_paused, fail, pause]
      description: Action applied to every node in node_ids (single-action batch form). Mutually exclusive with targets.
    cascade:
      type: boolean
      description: Propagate the action down to the whole subtree rooted at each node. With node_ids it applies to every node in the batch; with targets it serves as the default for entries that omit their own cascade flag. An atomic validated batch results whenever cascade is true.
    targets:
      type: array
      items:
        type: object
        properties:
          node_id:
            type: string
            description: Node to control; with cascade=true it is the subtree root.
          action:
            type: string
            enum: [resume, keep_paused, fail, pause]
            description: Action for this node or subtree.
          cascade:
            type: boolean
            description: When true, apply the action to the whole subtree rooted at node_id; when omitted, inherit the top-level cascade flag. The task root node with cascade=true targets the entire tree.
        required: [node_id, action]
      description: Per-node actions in one atomic call (e.g. pause subtree a while failing subtree b). The batch validates before applying anything. Subtrees claimed by different actions reject the whole call with error subtree_overlap listing the covered node ids; same-action nested subtrees are auto-merged (the absorbed target is reported in the response merged list). A cascade fail requires every non-terminal descendant to be paused first, otherwise the batch is rejected with subtree_not_fully_paused. Mutually exclusive with node_ids+action.
    remark:
      type: string
      description: One batch-wide annotation shared by all entries - failure reason for fail, registration remark for keep_paused (required there), annotation for pause. Per-entry remarks are not supported.
  required: [task_id]
governance:
  family: task_runtime
  display_name: Task Runtime
  description: Control paused task nodes after an error or operator review.
  actions:
    - id: manage_task_nodes
      label: Manage Task Nodes
      risk_level: medium
      destructive: true
      allowed_roles:
        - ceo
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true
