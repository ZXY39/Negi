schema_version: 1
kind: tool
display_name: "处理暂停节点"
name: manage_task_nodes
description: Resume, keep_paused, fail, succeed or pause task nodes (single, subtree, whole task) in one atomic call.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local task runtime tool for reviewing and controlling paused nodes, with task-level scope (task_id alone), subtree cascade, per-target actions, manual success closure (verifier nodes become manual passes), and atomic overlap rejection.
  compare_rule: Treat manifest, main/, parameter contract, or toolskills changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    task_id:
      type: string
      description: Target task id. Pass action with no node_ids and no targets to act on the task itself - pause/resume go through the task-level implementation (task flags, scheduling, in-flight suspension); fail/success/keep_paused apply to the task root with cascade.
    node_ids:
      type: array
      items:
        type: string
      description: Single-action batch form - one or more node ids that all receive the same action. Combine with action; mutually exclusive with targets. Omit (or leave empty) together with an action to act on the task itself instead.
    action:
      type: string
      enum: [resume, keep_paused, fail, success, pause]
      description: Action applied to every node in node_ids (single-action batch form), or to the task itself when no node_ids/targets are given (pause/resume are task-level; fail/success/keep_paused stay root+cascade). Mutually exclusive with targets. For resume, read each item's result - resumed means an executor is running, queued means a durable intent was recorded and the next pickup must consume it, deferred means a designed stop (waiting_acceptance / waiting_explicit) that is not a failure; verify queued with task_progress. success closes paused nodes as successful; on an acceptance node it is a manual pass (verifier verdict accepted, inspected execution node finalized success) and is recorded in metadata.manual_success. fail/success both require the node to be paused.
    cascade:
      type: boolean
      description: Propagate the action down to the whole subtree rooted at each node. With node_ids it applies to every node in the batch; with targets it serves as the default for entries that omit their own cascade flag. An atomic validated batch results whenever cascade is true. Cascade acts on nodes only - pausing the task root with cascade pauses the whole node tree but does not move the task itself. To pause/resume the task, omit node_ids and targets. A cascade fail/success is rejected unless every non-terminal descendant is already paused.
    targets:
      type: array
      items:
        type: object
        properties:
          node_id:
            type: string
            description: Node to control; with cascade=true it is the subtree root.
          action:
            type: string
            enum: [resume, keep_paused, fail, success, pause]
            description: Action for this node or subtree. resume reports per-node resumed/queued/deferred; queued is not failure. success on an acceptance node records a manual pass.
          cascade:
            type: boolean
            description: When true, apply the action to the whole subtree rooted at node_id; when omitted, inherit the top-level cascade flag. Cascading from the task root targets the entire node tree; it does not pause or resume the task itself.
        required: [node_id, action]
      description: Per-node actions in one atomic call (e.g. pause subtree a while failing subtree b). The batch validates before applying anything. Subtrees claimed by different actions reject the whole call with error subtree_overlap listing the covered node ids; same-action nested subtrees are auto-merged (the absorbed target is reported in the response merged list). A cascade fail/success requires every non-terminal descendant to be paused first, otherwise the batch is rejected with subtree_not_fully_paused. Mutually exclusive with node_ids+action.
    remark:
      type: string
      description: One batch-wide annotation shared by all entries - failure reason for fail, manual-pass note for success (also becomes its terminal summary when the node has no output), registration remark for keep_paused (required there), annotation for pause. Per-entry remarks are not supported.
  required: [task_id]
governance:
  display_name: Manage Task Nodes
  description: Resume, keep_paused, fail, succeed or pause task nodes (single, subtree, whole task) in one atomic call.
  risk_level: medium
  destructive: true
  allowed_roles:
    - ceo
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true
