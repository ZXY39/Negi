schema_version: 1
kind: tool
name: search_stickers
display_name: Sticker Search
description: Search the sticker library by what you want to express; returns candidate ids to send as `[[sticker:<pack>/@<id>]]`. Only registered when `stickers.semanticSearch` is enabled and the pack has per-image captions.
tool_result_delivery_contract: runtime_managed
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem:
    - workspace
parameters:
  type: object
  properties:
    query:
      type: string
      description: Short description of the emotion, attitude or bit you want to send, in the language of the reply.
    limit:
      type: integer
      description: Optional candidate count (default 5, max 10).
  required:
    - query
governance:
  display_name: Sticker Search
  description: Search the sticker library by what you want to express; returns candidate ids.
  risk_level: low
  destructive: false
  allowed_roles:
    - ceo
    - execution
    - inspection
recovery_policy:
  rerun_safe: true

exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: false
