schema_version: 1
kind: tool
display_name: "获取任务"
name: task_list
description: List tasks filtered by status and long-term type; rows carry task id, creation time, goal and latest progress. Pass scope=global to list across all sessions.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: >-
    Resource-local task runtime tool. The numeric task-type enum (1=all, 2=in progress, 3=failed,
    4=unread) is replaced by status (all/in_progress/success/failed) plus long_term and unread_only
    booleans; rows now carry task id, creation time, task goal and latest progress, with
    long-term/standby/paused/unread folded into the status label. Handler and governance live with
    the resource so discovery can refresh without a host restart.
  compare_rule: Treat manifest, main/, parameter contract, or returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    status:
      type: string
      enum: ["all", "in_progress", "success", "failed"]
      description: "Filter by task status; omit or all = all tasks."
    long_term:
      type: boolean
      description: "true=list only long-term (continuous standby) tasks, false=only one-shot tasks; omit for no filter."
    unread_only:
      type: boolean
      description: "true=list only tasks whose updates the session has not seen yet; omit for no filter."
    scope:
      type: string
      enum: ["session", "global"]
      description: "session (default) = only tasks of the current session; global = tasks across all sessions."
  required: []
governance:
  display_name: Task List
  description: List tasks filtered by status and long-term type; rows carry task id, creation time, goal and latest progress. Pass scope=global to list across all sessions.
  risk_level: low
  destructive: false
  allowed_roles:
    - ceo
recovery_policy:
  rerun_safe: true

exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true
