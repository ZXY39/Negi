schema_version: 1
kind: tool
tool_type: internal
name: douyin_native
description: Douyin browsing on the local logged-in Edge, with comment/reply/publish gated by send_policy.
tool_result_delivery_contract: runtime_managed
source:
  type: git
  url: https://github.com/LockyBee/dsh-douyin-agent
  ref: v1.4.6
  commit: 7989640e340f
  mirror_note: >-
    源码镜像自上游 main HEAD @7989640e340f（2026-10-30）；release v1.4.6 对应
    912873e2556d。本工具是 Negi 原生实现，不携带 DSH 运行时代码；分镜为 Pillow
    原生拼图，未 vendoring 上游 storyboard 库（SAOS-3624/dsh-video-storyboard, MIT）。
    检查更新：gh api repos/LockyBee/dsh-douyin-agent/releases/latest --jq .tag_name
current_version:
  summary: Negi native implementation in tools/douyin_native/main/tool.py. No DSH/cordis/@deepseek-ai dependency.
  compare_rule: Treat main/, resource.yaml, and toolskills changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: true
  filesystem:
  - workspace
parameters:
  type: object
  properties:
    action:
      type: string
      enum:
      - open
      - login_status
      - login_check
      - login_export
      - login_restore
      - feed
      - search
      - video
      - storyboard
      - comments
      - watch_report
      - my_works
      - interactions
      - send_comment
      - reply_to_comment
      - send_forward
      - publish
      - usage
      - health
      - close
      description: >-
        Which Douyin capability to run. open = ensure windowed Edge + douyin
        home + login detection (screenshot). login_status = report login state
        with multi-signal basis (UI header + server API + cookie names; never
        cookie-name-only). login_check = re-check after the human logs in and
        export the session cookies to login_state.json. login_export = force
        export cookies to login_state.json (current-user ACL). login_restore =
        inject login_state.json into the live context and verify. feed = read
        current recommend/selected feed items (also writes feed_snapshot.json
        pinning slot -> aweme_id). search = open the search page for
        keyword and parse results (login-walled while logged out; reported
        honestly, never faked). video = open player for feed slot N (verified
        against feed_snapshot.json; status=mismatch on drift) and return
        title/author/duration/publish_time/stats. storyboard = sample N frames of
        the current player video and compose a numbered grid PNG. comments = read
        real comment bodies of the current video (no DMs; re-verified after read). watch_report = browse a
        topic feed round and generate a Markdown report. my_works = read this
        account's own published works from the creator centre content list
        (read-only; title/duration/publish time/status/stats). interactions =
        read the 互动消息 notifications panel (评论/@我的/赞/粉丝/推荐 tabs,
        hours-filtered, newest first) so "comment -> reply -> targeted reply"
        works; optional locate_item follows one row into its source video and
        reports aweme_id + matched comment. send_comment /
        reply_to_comment / send_forward = SENDING, OFF by default, gated by
        send_policy.json + allow_send + quotas + receipt check (reply_to_comment
        also accepts aweme_id to target a notification's video directly). publish =
        upload a local video to creator.douyin.com/creator-micro/content/upload
        with real keyboard typing for title/description/topics; mode=draft
        (default) only stores a draft (暂存离开), mode=publish clicks 发布 and
        additionally requires send_policy allow_publish=true. usage = local
        daily usage ledger. health = environment diagnostics. close = close the
        Edge session gracefully (flushes cookies, preserves login_state.json).
    keyword:
      type: string
      description: Search keyword or topic for feed/watch_report (e.g. "贵州 美食").
    max_items:
      type: integer
      description: Max feed items to parse / include in a report (1-40).
    frame_count:
      type: integer
      description: Number of storyboard frames to sample (2-16).
    slot:
      type: integer
      description: >-
        1-based feed item index to open in the player (used by
        video/storyboard/comments/send_*/reply_to_comment). The slot is resolved
        to a concrete aweme_id through data/douyin_native/feed_snapshot.json
        (written by the last feed/watch_report run), and the opened video is
        verified to be that aweme_id.
    text:
      type: string
      description: Comment or reply body text (only for send_comment / reply_to_comment; gated).
    comment_index:
      type: integer
      description: >-
        1-based index of the target comment in the comments list returned by
        action=comments (reply_to_comment only). Either comment_index or
        comment_text_match is required to locate the comment being replied to.
    comment_text_match:
      type: string
      description: >-
        Substring matched against a comment body text or author name to locate
        the reply target (reply_to_comment only; alternative to comment_index).
    hours:
      type: number
      description: >-
        interactions only. Time window in hours (default 24). Rows whose own time
        label (刚刚 / N分钟前 / N小时前 / 昨天 / N天前 / M-D) resolves to an age above
        this are dropped and counted in filter.dropped_by_time.
    tab:
      type: string
      enum:
      - comment
      - mention
      - like
      - fan
      - recommend
      - all
      description: >-
        interactions only. Which tab of the 互动消息 panel to read: comment = 评论
        (replies to my comments, default), mention = @我的, like = 赞, fan = 粉丝,
        recommend = 推荐, all = whatever the panel opens on.
    locate_item:
      type: integer
      description: >-
        interactions only. 1-based index of an item in items; the tool follows that
        notification into its source video, verifies the mounted aweme_id, and (with
        comment_text_match) reports the matched comment + comment_id, i.e. exactly what
        reply_to_comment(aweme_id=...) needs. Read-only; sends nothing.
    aweme_id:
      type: string
      description: >-
        reply_to_comment only. Target video id taken from an interactions item
        (source_aweme_id): replies there instead of resolving a feed slot; the video is
        opened by id and its mounted identity is verified before anything is sent.
    allow_send:
      type: boolean
      description: >-
        Must be true to even attempt a send. Sending still requires
        send_policy.json to allow the specific action (allow_comment /
        allow_reply / allow_forward / allow_publish) and the caller to be
        logged in. Default false; every send is additionally quota + interval
        limited and receipt-checked.
    allow_publish:
      type: boolean
      description: >-
        Explicit publishing acknowledgement for mode=publish. A real public post
        requires ALL THREE: mode=publish, this flag true, and send_policy.json
        allow_publish=true. If any is missing the tool returns status=blocked and
        publishes nothing. mode=draft never needs it.
    video_path:
      type: string
      description: >-
        Absolute local path of the video to upload (publish only; mp4/mov/webm/
        m4v/avi/mkv). The file is picked through the creator page's real
        input[type=file]. Required for action=publish.
    title:
      type: string
      description: >-
        Work title, typed into the creator publish form with real keyboard
        events (React editor only syncs on real keystrokes; DOM fill() is never
        used). Optional but recommended; read back and compared before saving.
    desc:
      type: string
      description: >-
        Work description (作品简介), typed with real keyboard events into the
        contenteditable zone-container. Optional.
    tags:
      type: array
      items:
        type: string
      description: >-
        Topic tags; accepts an array or a comma / 、 / space separated string.
        Each tag is typed as '#tag' + Space into the description editor so the
        site turns it into a real topic chip, then the editor is read back and
        compared. Optional.
    mode:
      type: string
      enum:
      - draft
      - publish
      description: >-
        publish only. draft (default) = upload + fill title/desc/topics +
        click 暂存离开 (store draft); no 发布 click, no real public post.
        publish = click 发布 and additionally requires send_policy.json
        allow_publish=true AND the caller passing mode=publish explicitly. The
        tool refuses mode=publish otherwise (returns blocked).
    include_frames:
      type: boolean
      description: Whether watch_report samples storyboard frames for the first few items.
    verify_aweme_id:
      type: boolean
      description: >-
        Default true. Every slot-based action resolves the target aweme_id from
        data/douyin_native/feed_snapshot.json and verifies the mounted video
        identity (detail panel data-e2e-aweme-id / player-container video_<id>
        class) matches it; on drift it retries once by aweme_id, then returns
        status=mismatch with target_aweme_id + actual_aweme_id and performs no
        comment/reply/send. Set false only for debugging: both ids and
        aweme_match are still reported, verification is marked disabled.
  required:
  - action
exposure:
  agent: true
  main_runtime: true
toolskill:
  enabled: true
governance:
  display_name: Douyin Native
  description: Playwright-driven local Edge for read-only Douyin browsing, storyboard sampling, watch reports; sending gated by explicit user permission.
  risk_level: medium
  destructive: false
  allowed_roles:
  - ceo
  - execution