schema_version: 1
kind: tool
display_name: "创建异步任务"
name: create_async_task
description: >-
  Create a background task. Set `continuous: true` for a long-term/standby task; omit it
  for one-shot tasks. One-shot acceptance needs `final_acceptance_prompt`.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local task runtime tool. Handler and governance live with the resource so discovery can refresh without a host restart.
  compare_rule: Treat manifest, main/, parameter contract, or returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    task:
      type: string
      description: User request to dispatch as a background task.
    core_requirement:
      type: string
      description: One-sentence distilled core requirement for the task tree.
    execution_policy:
      type: object
      description: "Execution policy for the task. Must be a JSON object with a mode, never a JSON-encoded string."
      properties:
        mode:
          type: string
          enum: [focus, coverage]
          description: "`focus` for highest-value direct work, `coverage` to allow broader completion."
      required: [mode]
    file_targets:
      type: array
      description: Optional reopen targets for files or artifacts needed by the task. Use `[]` when no specific files are required - never pass a JSON-encoded string.
      items:
        type: object
        properties:
          path:
            type: [string, "null"]
            description: Exact absolute file path to reopen.
          ref:
            type: [string, "null"]
            description: Exact artifact or content ref to reopen.
    final_acceptance_prompt:
      type: string
      description: Acceptance criteria for the final result. Writing them spawns a final acceptance node; leave it empty when you can verify inline.
    continuous:
      type: boolean
      description: >-
        Create a continuous (standby) root: it keeps running and wakes on messages/events instead of
        finishing once. A continuous task has no submit or acceptance channel — it never submits results
        and never gets an acceptance node (`final_acceptance_prompt` is ignored). To end it, the node
        sends a message to the front door and you cancel the task. Omit for one-shot tasks.
  required: [task, core_requirement, execution_policy]
governance:
  display_name: Create Async Task
  description: Create a background task in the main runtime.
  risk_level: medium
  destructive: false
  allowed_roles:
    - ceo
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true

