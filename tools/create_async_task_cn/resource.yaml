schema_version: 1
kind: tool
display_name: "创建异步任务"
name: create_async_task
description: Create a background task in the main runtime. Optional `seed_tools` names tools whose contracts the root node gets in its first request, so its first call runs directly instead of spending a hop fetching the contract; the result reports every declared name the runtime did not seed.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local task runtime tool. Handler and governance live with the resource so discovery can refresh without a host restart.
  compare_rule: Treat manifest, main/, parameter contract, or returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    task:
      type: string
      description: User request to dispatch as a background task.
    core_requirement:
      type: string
      description: One-sentence distilled core requirement for the task tree.
    execution_policy:
      type: object
      description: "Execution policy for the task. Must be a JSON object with a mode, never a JSON-encoded string."
      properties:
        mode:
          type: string
          enum: [focus, coverage]
          description: "`focus` for highest-value direct work, `coverage` to allow broader completion."
      required: [mode]
    file_targets:
      type: array
      description: Optional reopen targets for files or artifacts needed by the task. Use `[]` when no specific files are required - never pass a JSON-encoded string.
      items:
        type: object
        properties:
          path:
            type: [string, "null"]
            description: Exact absolute file path to reopen.
          ref:
            type: [string, "null"]
            description: Exact artifact or content ref to reopen.
    requires_final_acceptance:
      type: boolean
      description: Whether the root execution should be followed by final acceptance.
    final_acceptance_prompt:
      type: string
      description: Required when `requires_final_acceptance=true`.
    seed_tools:
      type: array
      description: >-
        Optional. Tool names whose contracts should be delivered in the root execution node's first
        request so the first call can execute directly. Runtime filters by the node's role and reports
        every dropped name in the result. Omit when unsure.
      items:
        type: string
  required: [task, core_requirement, execution_policy]
governance:
  display_name: Create Async Task
  description: Create a background task in the main runtime.
  risk_level: medium
  destructive: false
  allowed_roles:
    - ceo
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true

