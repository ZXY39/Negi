schema_version: 1
kind: tool
name: memory_update
description: Queue a long-term memory change; do not edit `memory/` files. This only submits it—never say it is saved, revised or removed.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Repository-managed queued memory request tool for the CEO's single long-term memory entry point.
  compare_rule: Treat changes in main implementation, parameters, permissions, settings, or return payload shape as version changes.
  source_of_truth: This resource.yaml and the main implementation are authoritative; toolskills supplement usage guidance when present.
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    content:
      type: string
      description: Natural-language memory request to queue for the memory agent - what to remember, revise, or forget.
  required:
    - content
exposure:
  agent: true
  main_runtime: true
toolskill:
  enabled: true
