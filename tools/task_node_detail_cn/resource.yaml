schema_version: 1
kind: tool
display_name: "查询节点详情"
name: task_node_detail
description: >-
  View a task node's detail and its related artifacts. Agents always receive the full execution
  trace: every tool call with its arguments and its resolved output. Large results are
  externalised to a content ref, so continue with content_search / content_open on that ref
  instead of expecting the payload inline.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: >-
    Resource-local task runtime tool. Handler and governance live with the resource so discovery
    can refresh without a host restart. The agent surface no longer takes detail_level: it always
    returns the full execution trace, and the summary/light view is kept only for the Web REST
    transport. Roles widened from ceo to ceo/execution/inspection with no task-ownership guard.
  compare_rule: Treat manifest, main/, parameter contract, or returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective behavior.
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    任务id:
      type: string
      description: Target task id.
    节点id:
      type: string
      description: Target node id.
  required: [任务id, 节点id]
governance:
  family: task_runtime
  display_name: Task Runtime
  description: View task node detail and related artifacts.
  actions:
    - id: node_detail_cn
      label: Task Node Detail
      risk_level: low
      destructive: false
      allowed_roles:
        - ceo
        - execution
        - inspection
exposure:
  agent: true
  main_runtime: false
toolskill:
  enabled: true
