schema_version: 1
kind: tool
name: exec
description: Run shell commands directly (PowerShell/sh, no nested wrapper). background=true only when the process must outlive this call; stop it with process_kill.
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Resource-local exec tool. The manifest, handler, and runtime execution
    policy together define the current behavior.
  compare_rule: Treat manifest, main/, parameter contract, permissions, settings,
    and returned payload changes as version-relevant.
  source_of_truth: resource.yaml, main/, and toolskills together define the effective
    behavior.
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem:
  - workspace
settings:
  path_append: ''
  restrict_to_workspace: false
  enable_safety_guard: true
  # execution_mode (governed|full_access) is not declared here: the persisted
  # source of truth is the governance store's exec tool record
  # (metadata.execution_mode). A value in this manifest is ignored whenever the
  # record carries one, so keeping a copy here only creates two disagreeing truths.
parameters:
  type: object
  properties:
    command:
      type: string
      description: Read-only shell command to execute. Use this for local inspection
        and searching only; any filesystem creation, modification, deletion, rename,
        move, or patch workflow must use filesystem_write/edit/delete/propose_patch
        instead.
    working_dir:
      type: string
      description: Optional working directory override. Provide an absolute path when
        you need a specific directory. If omitted, exec defaults to `runtime_environment.task_temp_dir`
        when that runtime field is available; otherwise it falls back to the process
        default cwd. When restrict_to_workspace is enabled, working_dir must stay
        inside the workspace.
    background:
      type: boolean
      description: Detach the command so it keeps running after this call returns;
        answers pid + log_path immediately and then ignores timeout_seconds. Use it
        only when a later call must still find this process (server, browser, crawl
        driver). A command that is merely slow stays foreground. Stop it with
        process_kill(pid). When true, purpose is required.
    purpose:
      type: string
      description: Required when background=true. One line (<=120 chars; the process
        list shows the first 80) saying what this process serves and why it must
        outlive this call.
  required:
  - command
exposure:
  agent: true
  main_runtime: true
toolskill:
  enabled: true
