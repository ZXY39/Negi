schema_version: 1
kind: tool
name: memory_note
description: "Load the full body of one memory note. Pass the token the memory block shows - an entry's `note:<token>` or a consolidation line's `(note: <token>)` - exactly as shown; never invent or guess a note name. A real note file name also resolves."
tool_result_delivery_contract: runtime_managed
source:
  type: ''
  url: ''
  ref: ''
current_version:
  summary: Repository-managed note loader for detailed long-term memory note bodies.
  compare_rule: Treat changes in main implementation, parameters, permissions, settings, or return payload shape as version changes.
  source_of_truth: This resource.yaml and the main implementation are authoritative; toolskills supplement usage guidance when present.
protocol: mcp
mcp:
  transport: embedded
requires:
  tools: []
  bins: []
  env: []
permissions:
  network: false
  filesystem: []
parameters:
  type: object
  properties:
    ref:
      type: string
      description: "The token shown next to the note in the memory block (after `note:`); a real note file name also resolves."
  required:
    - ref
recovery_policy:
  rerun_safe: true

exposure:
  agent: true
  main_runtime: true
toolskill:
  enabled: true
