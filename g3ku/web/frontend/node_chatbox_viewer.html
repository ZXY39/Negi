<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>节点回复</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #162033;
            --muted: #5d6b82;
            --border: #d7dfeb;
            --accent: #1f6feb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
            color: var(--text);
        }

        .shell {
            max-width: 920px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(23, 38, 67, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 18px 24px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .title {
            margin: 0;
            font-size: 1.2rem;
        }

        .meta {
            color: var(--muted);
            font-size: 0.85rem;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* 与「打开一个 MD 文件」同形的正文区：一整篇按 Markdown 渲染的文档。 */
        .doc {
            padding: 20px 28px 26px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            font-size: 0.92rem;
            line-height: 1.7;
            word-break: break-word;
        }

        .doc h1, .doc h2, .doc h3, .doc h4 { margin: 14px 0 8px; line-height: 1.4; }
        .doc h1 { font-size: 1.2rem; }
        .doc h2 { font-size: 1.08rem; }
        .doc h3 { font-size: 0.98rem; }
        .doc pre {
            margin: 10px 0;
            padding: 12px 14px;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.84rem;
        }
        .doc code {
            font-family: Consolas, "Courier New", monospace;
            font-size: 0.86em;
        }
        .doc :not(pre) > code {
            background: #eef2f8;
            border: 1px solid #dde5f0;
            border-radius: 4px;
            padding: 0 4px;
        }
        .doc ul, .doc ol { margin: 8px 0; padding-left: 24px; }
        .doc blockquote {
            margin: 10px 0;
            padding: 4px 14px;
            border-left: 3px solid var(--border);
            color: var(--muted);
        }
        .doc table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 0.86rem; }
        .doc th, .doc td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
        .doc th { background: #f1f5fb; }
        .doc a { color: var(--accent); }
        .doc hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

        .reply-time {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 400;
            margin-left: 10px;
        }

        .status {
            color: var(--muted);
            font-size: 0.85rem;
            padding: 24px;
            text-align: center;
        }

        .status.error { color: #c23b3b; }
    </style>
</head>
<body>
    <main class="shell">
        <section class="card">
            <div class="header">
                <h1 class="title" id="title">节点回复</h1>
                <div class="meta">
                    <span id="task-id">task: -</span>
                    <span id="node-id">node: -</span>
                    <span id="count"></span>
                </div>
            </div>
            <div class="doc" id="doc">
                <div class="status">加载中…</div>
            </div>
        </section>
    </main>
    <script>
        // 与主应用 renderMarkdown 同族的最小实现：先整段 HTML 转义，再做受限的
        // 结构化替换（代码围栏/行内代码/标题/列表/引用/表格/链接/强调）。任何
        // 未被替换的字面量都以转义文本呈现，不存在裸 HTML 注入面。
        function escHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function renderInline(text) {
            let value = escHtml(text);
            const codes = [];
            value = value.replace(/`([^`]+)`/g, (_m, code) => {
                codes.push(`<code>${code}</code>`);
                return `\u0000${codes.length - 1}\u0000`;
            });
            value = value
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
                .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            value = value.replace(/\u0000(\d+)\u0000/g, (_m, index) => codes[Number(index)] || "");
            return value;
        }

        function renderMarkdown(value) {
            const text = String(value ?? "").replace(/\r\n?/g, "\n");
            const lines = text.split("\n");
            const blocks = [];
            let index = 0;
            while (index < lines.length) {
                const line = lines[index];
                if (!line.trim()) { index += 1; continue; }
                const fence = line.match(/^```([\w-]+)?\s*$/);
                if (fence) {
                    const codeLines = [];
                    index += 1;
                    while (index < lines.length && !/^```/.test(lines[index])) {
                        codeLines.push(lines[index]);
                        index += 1;
                    }
                    if (index < lines.length) index += 1;
                    blocks.push(`<pre><code>${escHtml(codeLines.join("\n"))}</code></pre>`);
                    continue;
                }
                const heading = line.match(/^(#{1,4})\s+(.*)$/);
                if (heading) {
                    const level = heading[1].length;
                    blocks.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
                    index += 1;
                    continue;
                }
                if (/^(---|\*\*\*|___)\s*$/.test(line)) {
                    blocks.push("<hr>");
                    index += 1;
                    continue;
                }
                if (/^\s*\|.*\|\s*$/.test(line) && index + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[index + 1])) {
                    const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
                    const head = cells(line);
                    index += 2;
                    const bodyRows = [];
                    while (index < lines.length && /^\s*\|.*\|\s*$/.test(lines[index])) {
                        bodyRows.push(cells(lines[index]));
                        index += 1;
                    }
                    const th = head.map((cell) => `<th>${renderInline(cell)}</th>`).join("");
                    const tb = bodyRows
                        .map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`)
                        .join("");
                    blocks.push(`<table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>`);
                    continue;
                }
                const listMatch = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
                if (listMatch) {
                    const ordered = /\d/.test(listMatch[2]);
                    const tag = ordered ? "ol" : "ul";
                    const items = [];
                    while (index < lines.length) {
                        const itemMatch = lines[index].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
                        if (!itemMatch || /\d/.test(itemMatch[2]) !== ordered) break;
                        items.push(`<li>${renderInline(itemMatch[3])}</li>`);
                        index += 1;
                    }
                    blocks.push(`<${tag}>${items.join("")}</${tag}>`);
                    continue;
                }
                if (/^>\s?/.test(line)) {
                    const quoteLines = [];
                    while (index < lines.length && /^>\s?/.test(lines[index])) {
                        quoteLines.push(lines[index].replace(/^>\s?/, ""));
                        index += 1;
                    }
                    blocks.push(`<blockquote>${renderInline(quoteLines.join("\n")).replace(/\n/g, "<br>")}</blockquote>`);
                    continue;
                }
                const paragraph = [];
                while (index < lines.length && lines[index].trim() && !/^(```|#{1,4}\s|>|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(lines[index]) && !/^(---|\*\*\*|___)\s*$/.test(lines[index])) {
                    paragraph.push(lines[index]);
                    index += 1;
                }
                if (paragraph.length) {
                    blocks.push(`<p>${renderInline(paragraph.join("\n")).replace(/\n/g, "<br>")}</p>`);
                } else {
                    index += 1;
                }
            }
            return blocks.join("");
        }

        function queryParam(name) {
            const value = new URLSearchParams(window.location.search).get(name);
            return String(value || "").trim();
        }

        function formatTime(value) {
            const raw = String(value || "").trim();
            if (!raw) return "";
            const parsed = new Date(raw);
            return Number.isNaN(parsed.getTime()) ? raw : parsed.toLocaleString();
        }

        async function fetchJson(url, options) {
            const response = await fetch(url, { headers: { "Accept": "application/json" }, ...(options || {}) });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload?.detail || payload?.message || `HTTP ${response.status}`);
            }
            return payload;
        }

        let lastMessageKey = "";

        async function loadReplies() {
            const taskId = queryParam("task_id");
            const nodeId = queryParam("node_id");
            const replyTo = queryParam("reply_to");
            const docEl = document.getElementById("doc");
            if (!taskId || !nodeId) {
                docEl.innerHTML = '<div class="status error">缺少 task_id 或 node_id。</div>';
                return;
            }
            document.getElementById("task-id").textContent = `task: ${taskId}`;
            document.getElementById("node-id").textContent = `node: ${nodeId}`;
            try {
                const params = new URLSearchParams();
                if (replyTo) params.set("reply_to", replyTo);
                const suffix = params.toString() ? `?${params.toString()}` : "";
                const data = await fetchJson(
                    `/api/tasks/${encodeURIComponent(taskId)}/nodes/${encodeURIComponent(nodeId)}/chatbox${suffix}`,
                );
                const messages = Array.isArray(data?.messages) ? data.messages : [];
                if (!messages.length) {
                    docEl.innerHTML = '<div class="status">这条消息还没有回复。节点回投后会出现在这里。</div>';
                    document.getElementById("count").textContent = "";
                    return;
                }
                // 一整篇文档：每条回复一个小节（时间随标题），Markdown 渲染。
                const sections = messages.map((entry) => {
                    const time = formatTime(entry?.created_at);
                    return `<h2>回复<span class="reply-time">${escHtml(time)}</span></h2>\n${renderMarkdown(entry?.message)}`;
                });
                docEl.innerHTML = sections.join('\n<hr>\n');
                document.getElementById("count").textContent = `${messages.length} 条回复`;
                const key = messages.map((item) => String(item?.message_id || "")).join(",");
                if (key !== lastMessageKey) {
                    lastMessageKey = key;
                    docEl.scrollTop = docEl.scrollHeight;
                }
                // 打开即视为已读：销账这条来信名下的回投，详情页「新回复」图标在下一拍消失。
                if (Number(data?.unread_count || 0) > 0) {
                    await fetchJson(
                        `/api/tasks/${encodeURIComponent(taskId)}/nodes/${encodeURIComponent(nodeId)}/chatbox/read`,
                        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reply_to: replyTo }) },
                    ).catch(() => null);
                }
            } catch (error) {
                docEl.innerHTML =
                    `<div class="status error">${escHtml(String(error?.message || error || "加载失败"))}</div>`;
            }
        }

        void loadReplies();
        window.setInterval(() => { void loadReplies(); }, 5000);
    </script>
</body>
</html>
