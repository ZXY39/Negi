name: Release

# 只为一个目的存在：给安装/升级脚本挂上 release 资产，作为 raw.githubusercontent.com
# 被 DNS 污染时的备用下载通道。分发形态仍是完整 checkout，不发布 wheel/sdist。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer-assets:
    name: Attach installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or refresh the release with the two installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" install.ps1 install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes "一行指令安装/升级入口脚本。完整源码请用页面下方的 Source code 归档。" \
            || gh release upload "$GITHUB_REF_NAME" install.ps1 install.sh --clobber
