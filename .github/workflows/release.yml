name: Release

# 只为一个目的存在：给安装/升级脚本挂上 release 资产，作为 raw.githubusercontent.com
# 被 DNS 污染时的备用下载通道。分发形态仍是完整 checkout，不发布 wheel/sdist。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer-assets:
    name: Attach installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or refresh the release with the two installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the annotation off the tag object through the API: the checkout's
          # local tag ref can be peeled to the commit, and then `%(contents)` silently
          # returns the commit message instead of the release notes.
          set -- $(gh api --jq '.object | "\(.type) \(.sha)"' "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          case "$1" in
            tag) gh api --jq .message "repos/$GITHUB_REPOSITORY/git/tags/$2" > release-notes.md ;;
            *) gh api --jq .message "repos/$GITHUB_REPOSITORY/git/commits/$2" > release-notes.md ;;
          esac
          [ -s release-notes.md ] || printf 'Negi %s\n' "$GITHUB_REF_NAME" > release-notes.md
          printf '\nThe two attached scripts are the one-line install and upgrade entry points (`iwr ... | iex`). Negi-Setup-<version>.exe is one downloaded file that installs with no network at all: it carries the trimmed source tree, every wheel this release resolves, a pinned CPython and uv, and installs them with `--offline --no-index` behind a folder-picking wizard. It is the only installer asset; Linux and macOS use the two scripts. Full source is in the Source code archive at the bottom of this page.\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" install.ps1 install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            || { gh release upload "$GITHUB_REF_NAME" install.ps1 install.sh --clobber; gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md; }

  # The wizard is a second front end to install.ps1, so it is built from the tagged
  # checkout and carries that checkout's own scripts. Unsigned on purpose: a valid
  # certificate would still show a SmartScreen prompt until the download reputation
  # accumulates, so it buys nothing a person installing their own tool needs.
  windows-installer:
    name: Build Negi-Setup.exe
    needs: [installer-assets, offline-kit-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Take the win-x64 kit the wizard embeds
        uses: actions/download-artifact@v4
        with:
          name: offline-kit-win-x64
          path: dist\kit
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build the wizard
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $declared = ''
          $init = Get-Content -LiteralPath 'g3ku\__init__.py' -Raw
          if ($init -match '__version__\s*=\s*"([^"]+)"') { $declared = $Matches[1] }
          if ($declared -ne $version) {
              throw "tag is $env:GITHUB_REF_NAME but g3ku/__init__.py declares '$declared': the asset name would not match the release"
          }
          $kit = @(Get-ChildItem -LiteralPath 'dist\kit' -Filter 'Negi-*-offline-win-x64.zip' -Recurse |
              Select-Object -First 1)
          if (-not $kit) { throw 'the win-x64 kit artifact did not arrive; the exe would not be offline' }
          .\packaging\build-setup.ps1 -Version $version -Kit $kit.FullName
          $exe = Join-Path 'dist' "Negi-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "build-setup.ps1 reported success but $exe is missing" }
          "SETUP_ASSET=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME $env:SETUP_ASSET --clobber

  # The Windows kit is an input, not an asset: it is embedded into Negi-Setup.exe by
  # the job below and stops there, so the release page carries one installer per
  # platform instead of an exe plus a copy of the archive inside it. A kit is the
  # trimmed source tree plus every wheel the release's lock resolves, the source-only
  # packages pre-built into wheels, a pinned CPython and uv; its build ends with the
  # gate that matters - an offline `uv pip install --no-index --find-links` into a
  # fresh venv.
  offline-kit-windows:
    name: Build the win-x64 offline kit
    needs: installer-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build and self-check the kit
        shell: pwsh
        run: |
          $zip = (./packaging/build-offline-kit.ps1 -Platform 'win-x64' -Ref $env:GITHUB_REF_NAME |
              Select-Object -Last 1)
          if (-not (Test-Path -LiteralPath $zip)) { throw "build-offline-kit.ps1 returned '$zip' but the file is missing" }
      - name: Hand the kit to the wizard job
        uses: actions/upload-artifact@v4
        with:
          name: offline-kit-win-x64
          path: dist/Negi-*-offline-win-x64.zip
          if-no-files-found: error
