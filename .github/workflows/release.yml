name: Release

# 只为一个目的存在：给安装/升级脚本挂上 release 资产，作为 raw.githubusercontent.com
# 被 DNS 污染时的备用下载通道。分发形态仍是完整 checkout，不发布 wheel/sdist。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer-assets:
    name: Attach installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or refresh the release with the two installer scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the annotation off the tag object through the API: the checkout's
          # local tag ref can be peeled to the commit, and then `%(contents)` silently
          # returns the commit message instead of the release notes.
          set -- $(gh api --jq '.object | "\(.type) \(.sha)"' "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          case "$1" in
            tag) gh api --jq .message "repos/$GITHUB_REPOSITORY/git/tags/$2" > release-notes.md ;;
            *) gh api --jq .message "repos/$GITHUB_REPOSITORY/git/commits/$2" > release-notes.md ;;
          esac
          [ -s release-notes.md ] || printf 'Negi %s\n' "$GITHUB_REF_NAME" > release-notes.md
          printf '\nThe two attached scripts are the one-line install and upgrade entry points (`iwr ... | iex`). Negi-Setup-<version>.exe is the same install.ps1 behind a folder-picking wizard, for a device that should not open a terminal; the Windows job attaches it. Negi-<version>-offline-<platform>.zip, in win-x64, linux-x64 and macos-arm64, is the offline kit: the trimmed source tree plus every wheel this release resolves for that platform, a pinned CPython, uv and the pinned requirement list, so a device that cannot reach a package index installs with `install.ps1 -Kit <zip>` or `install.sh --kit <zip>`. Pick the file named for your machine. Full source is in the Source code archive at the bottom of this page.\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" install.ps1 install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            || { gh release upload "$GITHUB_REF_NAME" install.ps1 install.sh --clobber; gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md; }

  # The wizard is a second front end to install.ps1, so it is built from the tagged
  # checkout and carries that checkout's own scripts. Unsigned on purpose: a valid
  # certificate would still show a SmartScreen prompt until the download reputation
  # accumulates, so it buys nothing a person installing their own tool needs.
  windows-installer:
    name: Build Negi-Setup.exe
    needs: installer-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build the wizard
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $declared = ''
          $init = Get-Content -LiteralPath 'g3ku\__init__.py' -Raw
          if ($init -match '__version__\s*=\s*"([^"]+)"') { $declared = $Matches[1] }
          if ($declared -ne $version) {
              throw "tag is $env:GITHUB_REF_NAME but g3ku/__init__.py declares '$declared': the asset name would not match the release"
          }
          .\packaging\build-setup.ps1 -Version $version
          $exe = Join-Path 'dist' "Negi-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "build-setup.ps1 reported success but $exe is missing" }
          "SETUP_ASSET=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME $env:SETUP_ASSET --clobber

  # A kit is the same version's tree plus everything needed to install it without an
  # index: every wheel this release's lock resolves for that platform (extras followed,
  # because a parent can ask for lxml[html-clean] and that edge lives in the child's
  # optional-dependencies table), the pinned requirement list uv exports from the same
  # lock, the source-only packages pre-built into wheels, a pinned CPython, and uv.
  # Each kit is built on the machine it installs to: the interpreter comes from uv, and
  # uv only provides one for its own host. The build ends with the gate that matters -
  # the device's own `uv pip install --offline --no-index --find-links`, run against an
  # empty --cache-dir, so a kit that cannot install by itself fails here instead of on a
  # machine that has no index to fall back on.
  offline-kits:
    name: Build the ${{ matrix.platform }} offline kit
    needs: installer-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runs_on: windows-latest
          - platform: linux-x64
            runs_on: ubuntu-latest
          - platform: macos-arm64
            runs_on: macos-latest
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build and self-check the kit
        shell: pwsh
        run: |
          # Forward slashes because this same step runs on a Linux and a macOS runner,
          # where a backslash inside a path is part of the file's name.
          $zip = (./packaging/build-offline-kit.ps1 -Platform '${{ matrix.platform }}' -Ref $env:GITHUB_REF_NAME |
              Select-Object -Last 1)
          if (-not (Test-Path -LiteralPath $zip)) { throw "build-offline-kit.ps1 returned '$zip' but the file is missing" }
          "KIT_ASSET=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Attach the kit to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME $env:KIT_ASSET --clobber
