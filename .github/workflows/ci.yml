name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Windows, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: windows-latest
    # 单片预算 20 分钟：整跑量到过 25 分钟以上，而 main 每几分钟就有一次推送，
    # cancel-in-progress 会把那条长作业顶掉——分片后每片都该在两次推送之间跑完。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shards: [4]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      # 切法与理由在 scripts/ci_test_shard.py：按文件体量贪心装箱，逐片只传显式文件名，
      # 不把 tests 目录参数交给 pytest。
      - name: Run this shard
        run: uv run python scripts/ci_test_shard.py --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}

  frontend:
    name: Frontend (Node)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 前端用例不在 pytest 里；Node 原生 test runner 作为合并前硬门禁。
      - name: Run frontend tests
        shell: bash
        run: node --test tests/resources/*.test.js

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # 存量 ruff 违规尚未清理：先设为 continue-on-error 保证结果可见但不阻断主线。
    # 存量清理完成后需移除 continue-on-error，使 lint 恢复为硬性门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run ruff
        run: uv run ruff check .