name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run tests
        run: uv run python -m pytest tests/ -q

  frontend:
    name: Frontend (Node)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 前端用例不在 pytest 里；Node 原生 test runner 作为合并前硬门禁。
      - name: Run frontend tests
        shell: bash
        run: node --test tests/resources/*.test.js

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # 存量 ruff 违规尚未清理：先设为 continue-on-error 保证结果可见但不阻断主线。
    # 存量清理完成后需移除 continue-on-error，使 lint 恢复为硬性门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run ruff
        run: uv run ruff check .